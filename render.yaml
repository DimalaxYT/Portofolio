services:
  - type: web
    name: dimalax-portfolio
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: PING_INTERNAL_SCHEDULER
        value: "false"
